packages:
  - apps/*
  - packages/*
  - extensions/*
  - tools/*

catalogMode: prefer

catalog:
  "@cloudflare/vite-plugin": ^1.70.1
  "@cloudflare/workers-types": ^5.20261120.1
  "@iconify-json/lucide": ^1.2.157
  "@iconify/vue": ^5.0.5
  "@types/node": ^24
  "@vueuse/core": ^15.0.0
  dompurify: ^3.4.18
  marked: ^18.2.1
  reka-ui: ^2.11.0
  typescript: ^7.0.2
  unocss: ^66.13.0
  unplugin-icons: ^24.0.0
  unplugin-vue-components: ^32.1.0
  unplugin-vue-router: ^0.19.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vue-draggable-plus: ^0.6.1
  wrangler: ^4.165.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
